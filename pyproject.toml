[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "document-segmenter"
version = "0.1.0"
description = "Segment PDF, DOCX and TXT documents into structured JSON or CSV."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
documents = ["pymupdf4llm>=0.0.17", "python-docx>=1.1.2"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
document-segmenter = "document_segmenter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
